name: Routing profiles (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Release
        run: dotnet build src/NetDM.Host/NetDM.Host.csproj -c Release
      - name: Run 1k / 10k / 30k profiles
        shell: pwsh
        run: ./scripts/run-profiles.ps1 -LaunchHost
      - name: Upload JSON and CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netdm-routing-profiles
          path: benchmarks/results/
          if-no-files-found: warn
          retention-days: 30
