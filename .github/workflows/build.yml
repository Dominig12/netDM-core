name: Build and test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/NetDM.Host/NetDM.Host.csproj --configuration Release
      - name: Core concurrency and consistency tests
        run: dotnet run --project tests/NetDM.SmokeTests --configuration Release
      - name: HTTP host, benchmark and visualizer integration
        run: bash tests/host-integration.sh
      - name: Profile script smoke test (Linux)
        run: pwsh -File scripts/run-profiles.ps1 -Sizes '160' -Seeds '7331' -Routes 20 -ViewportQueries 20 -MoveBatches 4 -LaunchHost
      - name: External monitor smoke test (Linux)
        shell: pwsh
        run: |
          ./scripts/capture-stalls.ps1 -DurationSeconds 2 -Label ci-linux -HostProcessId $PID -BaseUrl http://127.0.0.1:1 -SkipTrace
          $m = Get-ChildItem benchmarks/results/netdm-ci-linux-*-manifest.json | Select-Object -Last 1
          $manifest = Get-Content -Raw $m.FullName | ConvertFrom-Json
          $rows = @(Import-Csv $manifest.externalCsv)
          if ($rows.Count -lt 5 -or $manifest.targetProcessId -ne $PID) { throw 'External watchdog/manifest failed.' }
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build on Windows
        run: dotnet build src/NetDM.Host/NetDM.Host.csproj --configuration Release
      - name: Core correctness on Windows
        run: dotnet run --project tests/NetDM.SmokeTests --configuration Release
      - name: Profile script smoke test (Windows)
        shell: pwsh
        run: ./scripts/run-profiles.ps1 -Sizes '160' -Seeds '7331' -Routes 20 -ViewportQueries 20 -MoveBatches 4 -LaunchHost
      - name: External monitor smoke test (Windows)
        shell: pwsh
        run: |
          ./scripts/capture-stalls.ps1 -DurationSeconds 2 -Label ci-windows -HostProcessId $PID -BaseUrl http://127.0.0.1:1 -SkipTrace
          $m = Get-ChildItem benchmarks/results/netdm-ci-windows-*-manifest.json | Select-Object -Last 1
          $manifest = Get-Content -Raw $m.FullName | ConvertFrom-Json
          $rows = @(Import-Csv $manifest.externalCsv)
          if ($rows.Count -lt 5 -or $manifest.targetProcessId -ne $PID) { throw 'External watchdog/manifest failed.' }
