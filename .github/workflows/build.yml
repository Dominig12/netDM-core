name: Build and smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/NetDM.Host/NetDM.Host.csproj --configuration Release
      - run: dotnet run --project tests/NetDM.SmokeTests --configuration Release
